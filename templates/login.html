<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar sesion · Sianka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/panel.css">
</head>
<body class="panel login">
  <div class="login-fondo">
    <div class="login-tarjeta">
      <div class="login-logo">
        <span class="marca-logo" aria-hidden="true">S</span>
        <span class="nombre">Sianka</span>
      </div>
      <h1>Acceso del equipo</h1>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="login-campo">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="username" autofocus required>
        </div>
        <div class="login-campo">
          <label for="password">Contrasena</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-boton">Entrar</button>
      </form>

      <p class="login-legal">
        <a href="/privacidad">Aviso de privacidad</a> · <a href="/terminos">Terminos de servicio</a>
      </p>
    </div>
  </div>
</body>
</html>
